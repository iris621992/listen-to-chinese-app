name: Temporary Character Runtime Lockfile

on:
  push:
    branches:
      - agent/vocabulary-detail-first-real-learner-surface-v1

permissions:
  contents: write

concurrency:
  group: tmp-character-runtime-lock
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4
        with:
          ref: agent/vocabulary-detail-first-real-learner-surface-v1
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # releases/v4
        with:
          node-version: 24

      - name: Generate package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "PR #18 — lock Hanzi Writer runtime dependency"
          git push origin HEAD:agent/vocabulary-detail-first-real-learner-surface-v1
