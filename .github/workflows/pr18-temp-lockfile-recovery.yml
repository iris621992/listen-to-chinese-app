name: PR18 Temporary Lockfile Recovery

on:
  push:
    branches:
      - "agent/vocabulary-detail-first-real-learner-surface-v1"

permissions:
  contents: write

jobs:
  recover:
    name: recover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_START_HEAD: ba8d604a896974b1911d43a4b5e87c8377290a92
      TARGET_BRANCH: agent/vocabulary-detail-first-real-learner-surface-v1
      TEMP_WORKFLOW: .github/workflows/pr18-temp-lockfile-recovery.yml

    steps:
      - name: Checkout exact recovery trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Fail closed on starting authority
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_START_HEAD}"
          mapfile -t trigger_files < <(git diff --name-only "${EXPECTED_START_HEAD}" "${GITHUB_SHA}")
          test "${#trigger_files[@]}" -eq 1
          test "${trigger_files[0]}" = "${TEMP_WORKFLOW}"
          test "$(git show "${EXPECTED_START_HEAD}:package.json" | sha256sum | awk '{print $1}')" = "$(git show HEAD^:package.json | sha256sum | awk '{print $1}')"
          test "$(git show "${EXPECTED_START_HEAD}:package-lock.json" | sha256sum | awk '{print $1}')" = "$(git show HEAD^:package-lock.json | sha256sum | awk '{print $1}')"

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # releases/v4
        with:
          node-version: 24
          cache: npm

      - name: Snapshot exact dependency manifests
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "${RUNNER_TEMP}/package.before.json"
          cp package-lock.json "${RUNNER_TEMP}/package-lock.before.json"

      - name: Resolve only approved direct dependency updates
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --save-exact \
            next@16.3.5 \
            eslint-config-next@16.3.5

      - name: Validate package.json bounded change
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          assert.equal(before.dependencies?.next, '16.3.0');
          assert.equal(before.devDependencies?.['eslint-config-next'], '16.3.0');
          assert.equal(after.dependencies?.next, '16.3.5');
          assert.equal(after.devDependencies?.['eslint-config-next'], '16.3.5');

          const scrub = (value) => {
            const clone = structuredClone(value);
            if (clone.dependencies) delete clone.dependencies.next;
            if (clone.devDependencies) delete clone.devDependencies['eslint-config-next'];
            return clone;
          };

          assert.deepEqual(scrub(after), scrub(before));
          NODE

      - name: Validate lockfile changes are dependency-closure bounded
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');

          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          assert.equal(before.lockfileVersion, 3);
          assert.equal(after.lockfileVersion, 3);

          const withoutPackages = (lock) => {
            const clone = structuredClone(lock);
            delete clone.packages;
            return clone;
          };
          assert.deepEqual(withoutPackages(after), withoutPackages(before));

          const beforeRoot = structuredClone(before.packages['']);
          const afterRoot = structuredClone(after.packages['']);
          assert.equal(beforeRoot.dependencies?.next, '16.3.0');
          assert.equal(beforeRoot.devDependencies?.['eslint-config-next'], '16.3.0');
          assert.equal(afterRoot.dependencies?.next, '16.3.5');
          assert.equal(afterRoot.devDependencies?.['eslint-config-next'], '16.3.5');
          delete beforeRoot.dependencies.next;
          delete afterRoot.dependencies.next;
          delete beforeRoot.devDependencies['eslint-config-next'];
          delete afterRoot.devDependencies['eslint-config-next'];
          assert.deepEqual(afterRoot, beforeRoot);

          function depNames(entry) {
            return new Set([
              ...Object.keys(entry?.dependencies ?? {}),
              ...Object.keys(entry?.optionalDependencies ?? {}),
            ]);
          }

          function candidates(parentPath, depName) {
            const results = [];
            let cursor = parentPath;
            while (true) {
              results.push(cursor ? `${cursor}/node_modules/${depName}` : `node_modules/${depName}`);
              const marker = cursor.lastIndexOf('/node_modules/');
              if (marker === -1) break;
              cursor = cursor.slice(0, marker);
            }
            if (!results.includes(`node_modules/${depName}`)) results.push(`node_modules/${depName}`);
            return results;
          }

          function resolveChild(packages, parentPath, depName) {
            for (const candidate of candidates(parentPath, depName)) {
              if (Object.prototype.hasOwnProperty.call(packages, candidate)) return candidate;
            }
            return null;
          }

          function closure(lock) {
            const packages = lock.packages ?? {};
            const roots = ['node_modules/next', 'node_modules/eslint-config-next'];
            const seen = new Set();
            const queue = roots.filter((key) => packages[key]);
            while (queue.length) {
              const key = queue.shift();
              if (seen.has(key)) continue;
              seen.add(key);
              const entry = packages[key];
              for (const depName of depNames(entry)) {
                const child = resolveChild(packages, key, depName);
                if (child && !seen.has(child)) queue.push(child);
              }
            }
            return seen;
          }

          const allowed = new Set([...closure(before), ...closure(after)]);
          const allKeys = new Set([
            ...Object.keys(before.packages ?? {}),
            ...Object.keys(after.packages ?? {}),
          ]);
          const changed = [];
          for (const key of allKeys) {
            if (key === '') continue;
            const left = before.packages?.[key];
            const right = after.packages?.[key];
            if (JSON.stringify(left) !== JSON.stringify(right)) changed.push(key);
          }

          assert(changed.includes('node_modules/next'));
          assert(changed.includes('node_modules/eslint-config-next'));
          const unexplained = changed.filter((key) => !allowed.has(key));
          if (unexplained.length) {
            console.error('Unexplained lockfile changes outside approved dependency closure:');
            console.error(unexplained.join('\n'));
            process.exit(1);
          }

          console.log(`Validated ${changed.length} changed lockfile package entries.`);
          console.log(changed.join('\n'));
          NODE

      - name: Verify final staged scope and self-clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm "${TEMP_WORKFLOW}"
          git add package.json package-lock.json
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 3
          test "${staged[0]}" = ".github/workflows/pr18-temp-lockfile-recovery.yml"
          test "${staged[1]}" = "package-lock.json"
          test "${staged[2]}" = "package.json"
          git diff --cached --check

      - name: Commit and push bounded self-cleaning result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "PR #18 — reconcile Next 16.3.5 lockfile via temporary CI"
          git push origin "HEAD:${TARGET_BRANCH}"
