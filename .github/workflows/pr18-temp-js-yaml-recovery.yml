name: PR18 Temporary js-yaml Security Recovery

on:
  push:
    branches:
      - "agent/vocabulary-detail-first-real-learner-surface-v1"

permissions:
  contents: write

jobs:
  recover:
    name: recover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_START_HEAD: 0b92b7cc327a3e5e9aa17ab972ae046c6717bc2e
      TARGET_BRANCH: agent/vocabulary-detail-first-real-learner-surface-v1
      TEMP_WORKFLOW: .github/workflows/pr18-temp-js-yaml-recovery.yml

    steps:
      - name: Checkout exact recovery trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Fail closed on starting authority
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_START_HEAD}"
          mapfile -t trigger_files < <(git diff --name-only "${EXPECTED_START_HEAD}" "${GITHUB_SHA}")
          test "${#trigger_files[@]}" -eq 1
          test "${trigger_files[0]}" = "${TEMP_WORKFLOW}"

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # releases/v4
        with:
          node-version: 24
          cache: npm

      - name: Snapshot and verify exact dependency baseline
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "${RUNNER_TEMP}/package.before.json"
          cp package-lock.json "${RUNNER_TEMP}/package-lock.before.json"
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          assert.equal(lock.lockfileVersion, 3);
          assert.equal(lock.packages?.['node_modules/js-yaml']?.version, '4.3.1');
          assert.equal(lock.packages?.['node_modules/@eslint/eslintrc']?.version, '3.3.5');
          assert.equal(lock.packages?.['node_modules/@eslint/eslintrc']?.dependencies?.['js-yaml'], '^4.1.1');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(pkg.dependencies?.['js-yaml'], undefined);
          assert.equal(pkg.devDependencies?.['js-yaml'], undefined);
          NODE

      - name: Resolve exact patched transitive js-yaml only
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --no-save \
            js-yaml@4.3.2

      - name: Validate package.json unchanged
        shell: bash
        run: |
          set -euo pipefail
          cmp --silent package.json "${RUNNER_TEMP}/package.before.json"

      - name: Validate lockfile change is exactly js-yaml 4.3.1 to 4.3.2
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');

          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));

          assert.equal(before.lockfileVersion, 3);
          assert.equal(after.lockfileVersion, 3);

          const beforeMeta = structuredClone(before);
          const afterMeta = structuredClone(after);
          delete beforeMeta.packages;
          delete afterMeta.packages;
          assert.deepEqual(afterMeta, beforeMeta);

          const beforeKeys = Object.keys(before.packages ?? {}).sort();
          const afterKeys = Object.keys(after.packages ?? {}).sort();
          assert.deepEqual(afterKeys, beforeKeys);

          const changed = [];
          for (const key of beforeKeys) {
            if (JSON.stringify(before.packages[key]) !== JSON.stringify(after.packages[key])) {
              changed.push(key);
            }
          }

          assert.deepEqual(changed, ['node_modules/js-yaml']);
          assert.equal(before.packages['node_modules/js-yaml'].version, '4.3.1');
          assert.equal(after.packages['node_modules/js-yaml'].version, '4.3.2');
          assert.deepEqual(
            after.packages['node_modules/@eslint/eslintrc'],
            before.packages['node_modules/@eslint/eslintrc'],
          );
          assert.deepEqual(after.packages[''], before.packages['']);
          NODE

      - name: Verify final staged scope and self-clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm "${TEMP_WORKFLOW}"
          git add package-lock.json
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = ".github/workflows/pr18-temp-js-yaml-recovery.yml"
          test "${staged[1]}" = "package-lock.json"
          git diff --cached --check
          test -z "$(git diff --name-only -- package.json)"

      - name: Commit and push bounded self-cleaning result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "PR #18 — patch transitive js-yaml to 4.3.2 via temporary CI"
          git push origin "HEAD:${TARGET_BRANCH}"
